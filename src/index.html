<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jade Mandarin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="controls" aria-label="Settings">
    <label class="select">
      <span class="sr">Difficulty</span>
      <select id="difficulty">
        <option value="simple">Simple · HSK 1–2</option>
        <option value="conversational">Conversational · HSK 3–4</option>
        <option value="difficult">Difficult · HSK 5–6</option>
      </select>
    </label>
    <button class="toggle" id="t-pinyin" aria-pressed="false" title="Pinyin (P)">pīn</button>
    <button class="toggle" id="t-script" aria-pressed="false" title="Simplified / Traditional (S)">简</button>
    <button class="toggle" id="t-english" aria-pressed="false" title="English translation (E)">EN</button>
  </header>

  <main id="stage">
    <div id="sentence" class="sentence" lang="zh"></div>
    <p id="translation" class="translation"></p>
    <button class="new" id="next" title="New sentence (Space)">New sentence ↻</button>
  </main>

  <section id="focus" class="focus" aria-live="polite"></section>

  <script src="../data/build/data.js"></script>
  <script src="app.js"></script>
</body>
</html>
